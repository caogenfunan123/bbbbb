{{- define "main" }}
<div class="terms-page">
  <h1 class="taxonomy-title">{{ .Title }}</h1>
  <div class="terms-list">
    {{- range .Data.Terms.Alphabetical }}
    <a class="term-item" href="{{ .Page.RelPermalink }}">{{ .Page.Title }} <span class="term-count">{{ .Count }}</span></a>
    {{- end }}
  </div>
</div>
{{- end }}
