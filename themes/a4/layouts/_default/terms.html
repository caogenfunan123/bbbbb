{{- define "main" }}
<div class="terms-page">
  <h1 class="taxonomy-title">{{ .Title }}</h1>
  <div class="terms-list">
    {{- range .Pages.ByCount.Reverse }}
    <a class="term-item" href="{{ .RelPermalink }}">{{ .Title }} <span class="term-count">{{ .Count }}</span></a>
    {{- end }}
  </div>
</div>
{{- end }}
