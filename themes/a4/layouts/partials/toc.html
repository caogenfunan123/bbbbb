{{- if and .WordCount (gt .WordCount 200) (site.Params.tool.topToc) }}
<details class="top-toc">
  <summary>目录</summary>
  {{- .TableOfContents }}
</details>
{{- end }}
{{- if and .WordCount (gt .WordCount 400) (site.Params.tool.leftToc) (not .IsHome) }}
<nav class="left-toc-container">
  <div class="tocify">{{ .TableOfContents }}</div>
</nav>
{{- end }}
