baseURL = 'https://c.caogenfunan.me/'
languageCode = 'zh-cn'
title = '我的博客'
theme = 'PaperMod'

# 分页
[pagination]
  pagerSize = 10

# 启用 emoji
enableEmoji = true

# 代码高亮
[markup]
  [markup.highlight]
    noClasses = false

# Params
[params]
  title = '我的博客'
  description = '分享技术、生活和思考的个人博客'

  # 首页信息
  [params.homeInfoParams]
    title = '你好，欢迎来到我的博客'
    content = '这里是我的个人博客，分享技术、生活和思考。'

  # 社交链接
  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/caogenfunan123'

  # 显示阅读时间
  showReadingTime = true
  # 显示文章目录
  showToc = true
  # 显示面包屑
  showBreadCrumbs = true
  # 显示代码复制按钮
  showCodeCopyButtons = true

  # 日期格式
  dateFormat = '2006-01-02'

  # 封面图全尺寸
  [params.cover]
    linkFullImages = true

  # 搜索配置
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ['title', 'permalink', 'summary', 'content']

# 输出配置
[outputs]
  home = ['HTML', 'RSS', 'JSON']

# 分类
[taxonomies]
  category = 'categories'
  tag = 'tags'
  series = 'series'