baseURL = 'https://c.caogenfunan.me/'
languageCode = 'zh-cn'
title = '我的博客'
theme = 'a4'

# 分页
[pagination]
  pagerSize = 10

# 首页文章列表来源（A4 首页 list 功能）
mainSections = ['posts']

# 启用 emoji
enableEmoji = true

# 允许构建未来日期的文章
buildFuture = true

# 代码高亮
[markup]
  [markup.highlight]
    noClasses = false

# 导航菜单
[[menus.main]]
  name = '文章'
  url = '/posts/'
  weight = 1

[[menus.main]]
  name = '标签'
  url = '/tags/'
  weight = 2

[[menus.main]]
  name = '分类'
  url = '/categories/'
  weight = 3

[[menus.main]]
  name = '关于'
  url = '/about/'
  weight = 4

# 分类
[taxonomies]
  category = 'categories'
  tag = 'tags'
  series = 'series'

# Params（A4 主题配置）
[params]
  title = '我的博客'
  description = '分享技术、生活和思考的个人博客'
  favicon = '/favicon.ico'
  displayTitleInTab = false  # 是否在浏览器标签页显示文章标题
  showCodeCopyButtons = true # 代码块复制按钮

  # ---- 首页配置 ----
  [params.index]
    header = '「让读者专注于阅读文字，写者专注于写作。」'  # 首页页眉语句
    hitokoto = false      # 一言：网络语句接口
    footer = ''           # 首页页脚（Email:xxx 会自动邮箱链接化）
    titlePosition = 'left'  # center | left
    width = 'small'         # small | middle | big
    list = true             # 开启后首页展示文章列表

  # ---- 页脚链接 ----
  [params.footerLink]
    info = '© 2024-2026 My Blog'

  # ---- 文章页配置 ----
  [params.post]
    width = 'middle'        # middle | big
    titlePosition = 'center'  # center | left
    themeInfo = true        # 页脚右侧声明本站信息

  # ---- 工具开关 ----
  [params.tool]
    darkMode = true         # 暗黑模式
    returnToTop = true      # 回到顶部按钮
    topToc = true           # 文章顶部目录
    leftToc = true          # 文章左侧目录（大屏浮现）

  # ---- 文章信息 ----
  [params.postInfo]
    updateDate = true       # 显示最近更新时间
    wordCount = true        # 显示字数统计
    readTime = true         # 显示阅读耗时
    [params.postInfo.prevAndNextLink]
      status = true         # 上一篇/下一篇
      prevInfo = '上一篇'
      nextInfo = '下一篇'

  # ---- 字体 ----
  [params.font]
    enable = false          # 是否启用字体开关（霞鹜文楷）

  # ---- 自定义 CSS 注入 ----
  [params.inject]
    css = 'css/custom.css'

  # ---- 评论（默认 waline，未配置 serverUrl 则不显示）----
  [params.comment]
    enable = false
    use = 'waline'          # waline | giscus | twikoo | artalk
    [params.comment.waline]
      serverUrl = ''        # 你的 Waline 服务地址
      lang = 'zh-CN'
      placeholder = '留下你的评论吧。'
    [params.comment.giscus]
      dataRepo = ''
      dataRepoId = ''
      dataCategory = ''
      dataCategoryId = ''
      dataMapping = 'pathname'
      dataTheme = 'preferred_color_scheme'
      dataLang = 'zh-CN'

# 输出配置
[outputs]
  home = ['HTML', 'RSS']
